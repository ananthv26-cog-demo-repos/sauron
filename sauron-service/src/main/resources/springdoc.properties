# OpenAPI document: only the Sauron controllers, only the responses declared on them (Springfox Docket did the same)
springdoc.packages-to-scan=com.freenow.sauron.controller
springdoc.override-with-generic-response=false
# springdoc 2 writes OpenAPI 3.1 by default; keep the 3.0 document consumers got from springdoc 1
springdoc.api-docs.version=openapi_3_0
